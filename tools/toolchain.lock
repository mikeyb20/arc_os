# arc_os pinned toolchain (sourced by tools/dev-setup.sh and .github/workflows/toolchain.yml).
#
# Sources: GNU release tarballs, checked by SHA-256 before anything is built. GCC's in-tree
# prerequisites (GMP, MPFR, MPC, ISL) come from contrib/download_prerequisites, which checks
# them against contrib/prerequisites.sha512 inside the pinned GCC tarball.
#
# Binary: built once by the "toolchain" workflow on ubuntu-24.04 and published as a release
# asset of mikeyb20/arc_os. Bump TOOLCHAIN_RELEASE (toolchain-v2, ...) whenever a version or a
# configure flag changes; never replace an asset in place.

BINUTILS_VERSION=2.42
BINUTILS_URL=https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz
BINUTILS_SHA256=f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800

GCC_VERSION=14.1.0
GCC_URL=https://ftp.gnu.org/gnu/gcc/gcc-14.1.0/gcc-14.1.0.tar.xz
GCC_SHA256=e283c654987afe3de9d8080bc0bd79534b5ca0d681a73a11ff2b5d3767426840

TOOLCHAIN_TARGET=x86_64-elf
TOOLCHAIN_RELEASE=toolchain-v1
TOOLCHAIN_ASSET=x86_64-elf-toolchain-14.1.0-2.42.tar.zst
TOOLCHAIN_URL=https://github.com/mikeyb20/arc_os/releases/download/toolchain-v1/x86_64-elf-toolchain-14.1.0-2.42.tar.zst
# Filled in from the workflow's output after the first build (the asset's .sha256 file).
TOOLCHAIN_SHA256=3ad83334c3b8def4defcdf7827af4610e4ad2e2c59faec4a16dcb718a5948cfd

# Limine binary release, pinned by commit (tag v8.7.0-binary).
LIMINE_REPO=https://github.com/limine-bootloader/limine.git
LIMINE_TAG=v8.7.0-binary
LIMINE_COMMIT=aad3edd370955449717a334f0289dee10e2c5f01

# User-space toolchain (M2-01): GCC 14.1.0 (C, C++, libstdc++) + binutils 2.42 + musl 1.2.5,
# built offline from the archive by ports/musl-cross-make/build.sh (job "musl" of the
# toolchain workflow) and installed by `tools/dev-setup.sh musl` into $HOME/opt/cross-musl.
# Bump MUSL_TOOLCHAIN_RELEASE whenever a version, a patch or config.mak changes.
MUSL_TOOLCHAIN_TARGET=x86_64-linux-musl
MUSL_TOOLCHAIN_RELEASE=toolchain-musl-v1
MUSL_TOOLCHAIN_ASSET=x86_64-linux-musl-toolchain-14.1.0-2.42-1.2.5.tar.zst
MUSL_TOOLCHAIN_URL=https://github.com/mikeyb20/arc_os/releases/download/toolchain-musl-v1/x86_64-linux-musl-toolchain-14.1.0-2.42-1.2.5.tar.zst
# Filled in from the workflow's output after the first build.
MUSL_TOOLCHAIN_SHA256=
