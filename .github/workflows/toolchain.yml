# Builds the pinned cross toolchains from tools/toolchain.lock and publishes each as a
# release asset of this repo:
#   build  x86_64-elf (binutils + GCC, C only) for the kernel and libarc
#   musl   x86_64-linux-musl (GCC + libstdc++, binutils, musl) for user space (M2-01),
#          built offline from the archive by ports/musl-cross-make/build.sh
#
# Runs on manual trigger, and on pushes that change the lock, the musl port or this file.
# A job does nothing when the asset named in the lock already exists: assets are never
# replaced in place, a new toolchain gets a new *_RELEASE.
name: toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - tools/toolchain.lock
      - ports/musl-cross-make/**
      - .github/workflows/toolchain.yml

permissions:
  contents: write

concurrency:
  group: toolchain
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read lock
        run: grep -E '^[A-Z0-9_]+=' tools/toolchain.lock >> "$GITHUB_ENV"

      - name: Skip if the asset already exists
        id: exists
        run: |
          if gh release view "$TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -qx "$TOOLCHAIN_ASSET"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$TOOLCHAIN_ASSET is already published in $TOOLCHAIN_RELEASE; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.exists.outputs.already == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex texinfo zstd

      - name: Download and verify sources
        if: steps.exists.outputs.already == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/src" && cd "$RUNNER_TEMP/src"
          curl -fsSLo binutils.tar.xz "$BINUTILS_URL"
          curl -fsSLo gcc.tar.xz "$GCC_URL"
          sha256sum binutils.tar.xz gcc.tar.xz
          echo "$BINUTILS_SHA256  binutils.tar.xz" | sha256sum -c -
          echo "$GCC_SHA256  gcc.tar.xz" | sha256sum -c -
          tar xf binutils.tar.xz
          tar xf gcc.tar.xz
          cd "gcc-$GCC_VERSION" && ./contrib/download_prerequisites

      - name: Build binutils
        if: steps.exists.outputs.already == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/build-binutils" && cd "$RUNNER_TEMP/build-binutils"
          "$RUNNER_TEMP/src/binutils-$BINUTILS_VERSION/configure" \
            --target="$TOOLCHAIN_TARGET" --prefix="$RUNNER_TEMP/cross" \
            --with-sysroot --disable-nls --disable-werror
          make MAKEINFO=true -j"$(nproc)"
          make MAKEINFO=true install

      - name: Build GCC (C only)
        if: steps.exists.outputs.already == 'false'
        run: |
          export PATH="$RUNNER_TEMP/cross/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/build-gcc" && cd "$RUNNER_TEMP/build-gcc"
          "$RUNNER_TEMP/src/gcc-$GCC_VERSION/configure" \
            --target="$TOOLCHAIN_TARGET" --prefix="$RUNNER_TEMP/cross" \
            --disable-nls --enable-languages=c --without-headers \
            --disable-shared --disable-threads --with-newlib --disable-hosted-libstdcxx
          make all-gcc -j"$(nproc)"
          make all-target-libgcc -j"$(nproc)"
          make install-strip-gcc
          make install-target-libgcc

      - name: Smoke test (relocated)
        if: steps.exists.outputs.already == 'false'
        run: |
          # Prove the toolchain works from a different directory than it was built for.
          mv "$RUNNER_TEMP/cross" "$RUNNER_TEMP/relocated"
          T="$RUNNER_TEMP/relocated/bin/$TOOLCHAIN_TARGET"
          printf 'int f(int x){return x*2;}\nvoid _start(void){for(;;){}}\n' > "$RUNNER_TEMP/t.c"
          "$T-gcc" -ffreestanding -nostdlib -mno-red-zone -O2 -c "$RUNNER_TEMP/t.c" -o "$RUNNER_TEMP/t.o"
          "$T-ld" "$RUNNER_TEMP/t.o" -o "$RUNNER_TEMP/t.elf"
          "$T-gcc" --version | head -1
          "$T-ld" --version | head -1
          mv "$RUNNER_TEMP/relocated" "$RUNNER_TEMP/cross"

      - name: Pack
        if: steps.exists.outputs.already == 'false'
        run: |
          cd "$RUNNER_TEMP"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C cross -cf - . \
            | zstd -19 -T0 -o "$TOOLCHAIN_ASSET"
          sha256sum "$TOOLCHAIN_ASSET" | tee "$TOOLCHAIN_ASSET.sha256"
          ls -l "$TOOLCHAIN_ASSET"

      - name: Publish release asset
        if: steps.exists.outputs.already == 'false'
        run: |
          cd "$RUNNER_TEMP"
          if ! gh release view "$TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "x86_64-elf toolchain ($TOOLCHAIN_RELEASE)" \
              --notes "binutils $BINUTILS_VERSION + GCC $GCC_VERSION (C only), target $TOOLCHAIN_TARGET, built on ubuntu-24.04 from tools/toolchain.lock. Install with tools/dev-setup.sh."
          fi
          gh release upload "$TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" \
            "$TOOLCHAIN_ASSET" "$TOOLCHAIN_ASSET.sha256"
          echo "Put this in tools/toolchain.lock as TOOLCHAIN_SHA256:"
          cut -d' ' -f1 "$TOOLCHAIN_ASSET.sha256"

  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read lock
        run: grep -E '^[A-Z0-9_]+=' tools/toolchain.lock >> "$GITHUB_ENV"

      - name: Skip if the asset already exists
        id: exists
        run: |
          if gh release view "$MUSL_TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -qx "$MUSL_TOOLCHAIN_ASSET"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$MUSL_TOOLCHAIN_ASSET is already published in $MUSL_TOOLCHAIN_RELEASE; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.exists.outputs.already == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential m4 bison flex texinfo zstd

      - name: Build (offline, sources from the archive)
        if: steps.exists.outputs.already == 'false'
        run: ports/musl-cross-make/build.sh "$RUNNER_TEMP/cross-musl"

      - name: Smoke test (relocated)
        if: steps.exists.outputs.already == 'false'
        run: |
          # Prove the toolchain works from another directory and makes static C and C++ programs.
          mv "$RUNNER_TEMP/cross-musl" "$RUNNER_TEMP/relocated"
          T="$RUNNER_TEMP/relocated/bin/$MUSL_TOOLCHAIN_TARGET"
          printf '#include <stdio.h>\nint main(void){puts("c ok");return 0;}\n' > "$RUNNER_TEMP/t.c"
          printf '#include <iostream>\n#include <stdexcept>\nint main(){try{throw std::runtime_error("x");}catch(const std::exception&){std::cout<<"c++ ok\\n";}return 0;}\n' > "$RUNNER_TEMP/t.cpp"
          "$T-gcc" -static -march=x86-64-v3 -O2 "$RUNNER_TEMP/t.c" -o "$RUNNER_TEMP/t"
          "$T-g++" -static -march=x86-64-v3 -O2 "$RUNNER_TEMP/t.cpp" -o "$RUNNER_TEMP/tpp"
          file "$RUNNER_TEMP/t" "$RUNNER_TEMP/tpp" | tee /dev/stderr | grep -c 'statically linked' | grep -qx 2
          "$RUNNER_TEMP/t" && "$RUNNER_TEMP/tpp"
          "$T-gcc" -v 2>&1 | tail -1
          mv "$RUNNER_TEMP/relocated" "$RUNNER_TEMP/cross-musl"

      - name: Pack
        if: steps.exists.outputs.already == 'false'
        run: |
          cd "$RUNNER_TEMP"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C cross-musl -cf - . \
            | zstd -19 -T0 -o "$MUSL_TOOLCHAIN_ASSET"
          sha256sum "$MUSL_TOOLCHAIN_ASSET" | tee "$MUSL_TOOLCHAIN_ASSET.sha256"
          ls -l "$MUSL_TOOLCHAIN_ASSET"

      - name: Publish release asset
        if: steps.exists.outputs.already == 'false'
        run: |
          cd "$RUNNER_TEMP"
          if ! gh release view "$MUSL_TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$MUSL_TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "x86_64-linux-musl toolchain ($MUSL_TOOLCHAIN_RELEASE)" \
              --notes "GCC 14.1.0 (C, C++), binutils 2.42, musl 1.2.5 for $MUSL_TOOLCHAIN_TARGET, built offline on ubuntu-24.04 by ports/musl-cross-make/build.sh. Install with tools/dev-setup.sh musl."
          fi
          gh release upload "$MUSL_TOOLCHAIN_RELEASE" -R "$GITHUB_REPOSITORY" \
            "$MUSL_TOOLCHAIN_ASSET" "$MUSL_TOOLCHAIN_ASSET.sha256"
          echo "Put this in tools/toolchain.lock as MUSL_TOOLCHAIN_SHA256:"
          cut -d' ' -f1 "$MUSL_TOOLCHAIN_ASSET.sha256"
