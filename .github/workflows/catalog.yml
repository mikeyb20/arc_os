# Kiwix catalog (M3-01, docs/plans/content-lane.md): cloud sessions can't reach
# library.kiwix.org, so this job reads the English catalog with
# tools/content/catalog.py, prints the table into the log and keeps it (and the raw
# feed) as an artifact. It only reads public catalog data: the content list built
# from it stays out of this repo. No ZIM is downloaded.
name: catalog

on:
  workflow_dispatch:
    inputs:
      meta:
        description: Read License and Source metadata for ZIM names matching this regex
        required: false
        default: ""
  push:
    branches-ignore: [master]
    paths:
      - tools/content/catalog.py
      - .github/workflows/catalog.yml

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  # Candidate ZIMs for the plan's categories (general, medical, food, repair/building),
  # chosen from a first catalog read.
  META_DEFAULT: >-
    ^(wikipedia_en_(all|top|top1m|medicine|100)|mdwiki_en_all|wiktionary_en_all|wikibooks_en_all|wikisource_en_all|
    wikiversity_en_all|libretexts\.org_en_(med|eng|workforce)|nhs\.uk_en_medicines|wwwnc\.cdc\.gov_en_all|
    irp\.fas\.org_en_military-medicine|ready\.gov_en_all|zimgit-.*|ifixit_en_all|appropedia_en_all|
    energypedia_en_all|solar\.lowtechmagazine\.com_mul_all|based\.cooking_en_all|foss\.cooking_en_all|
    publicdomainrecipes\.com_en_all|gardenology_en_all|(cooking|diy|mechanics|electronics|woodworking|engineering|
    gardening|medicalsciences|bicycles|3dprinting|ham|outdoors|sustainability|homebrew|lifehacks)\.stackexchange\.com_en_all)$

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the English catalog
        env:
          META: ${{ inputs.meta || env.META_DEFAULT }}
        run: |
          mkdir -p out
          python3 -I tools/content/catalog.py --lang eng --save out/catalog-eng.xml \
            --meta "$(printf '%s' "$META" | tr -d ' \n')" --out out/catalog-eng.tsv
          cat out/catalog-eng.tsv
          echo "--- first entry of the feed"
          python3 -I -c 'import sys; d = open(sys.argv[1]).read(); i = d.find("<entry"); print(d[i:d.find("</entry>", i) + 8])' out/catalog-eng.xml

      - name: Upload the table
        uses: actions/upload-artifact@v4
        with:
          name: kiwix-catalog-eng
          path: out
          retention-days: 30
