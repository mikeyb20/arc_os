# Kiwix catalog (M3-01, docs/plans/content-lane.md): cloud sessions can't reach
# library.kiwix.org, so this job reads the English catalog with
# tools/content/catalog.py, prints the table into the log and keeps it (and the raw
# feed) as an artifact. It only reads public catalog data: the content list built
# from it stays out of this repo. No ZIM is downloaded.
name: catalog

on:
  workflow_dispatch:
    inputs:
      meta:
        description: Read License and Source metadata for ZIM names matching this regex
        required: false
        default: ""
  push:
    branches-ignore: [master]
    paths:
      - tools/content/catalog.py
      - .github/workflows/catalog.yml

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  # Candidates for the plan's categories (general, medical, food, repair/building).
  META_DEFAULT: >-
    ^(wikipedia_en_(all|top|medicine|simple|100|wp1)|mdwiki|wikem|ifixit|appropedia|energypedia|wikibooks_en|wikivoyage_en|wikihow|
    .*(stackexchange|cooking|food|recipe|diy|repair|survival|medic|health|first.aid|garden|woodwork|electronic|mechanic|building))

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the English catalog
        env:
          META: ${{ inputs.meta || env.META_DEFAULT }}
        run: |
          mkdir -p out
          python3 -I tools/content/catalog.py --lang eng --save out/catalog-eng.xml \
            --meta "$(printf '%s' "$META" | tr -d ' \n')" --out out/catalog-eng.tsv
          cat out/catalog-eng.tsv

      - name: Upload the table
        uses: actions/upload-artifact@v4
        with:
          name: kiwix-catalog-eng
          path: out
          retention-days: 30
