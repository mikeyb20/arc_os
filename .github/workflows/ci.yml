# Cross build (kernel, libc, userland, ISO) and host unit tests, then the
# QEMU boot tests (`ctest -L qemu`, M0-02) in their own job. After both pass on a
# push to master, the bring-up image is published as the `bringup-latest`
# pre-release (parallel-lanes.md §6.2 item 1, ADR-0021).
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer PR push cancels the older run. A master run is never cancelled once it
# has started (a newer one waits), so the publish job can't be stopped between
# deleting the old release and creating the new one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/toolchain.lock') }}

      - name: Dev setup (apt, toolchain, Limine)
        run: bash tools/dev-setup.sh

      - name: Record tool versions
        run: |
          ~/opt/cross/bin/x86_64-elf-gcc --version | head -1
          nasm -v
          qemu-system-x86_64 --version | head -1
          cmake --version | head -1

      # M0-09 (ADR-0020): clang-format on the lines this PR changes, never on
      # untouched code. The checkout is the merge commit, so diffing it against
      # the base branch tip covers exactly the PR's changes.
      - name: Format check (changed lines only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          out=$(git clang-format --diff --extensions c,h "origin/${{ github.base_ref }}" -- kernel libc userland stack tests || true)
          if printf '%s\n' "$out" | grep -q '^diff '; then
            printf '%s\n' "$out"
            echo "::error::Changed lines are not clang-formatted (.clang-format). Fix: git clang-format origin/${{ github.base_ref }}"
            exit 1
          fi
          echo "format ok: ${out:-no C changes}"

      - name: Cross build (kernel, libc, userland)
        run: |
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=toolchain-x86_64.cmake
          cmake --build build

      - name: ISO
        run: cmake --build build --target iso

      # Built on every event, so a PR that breaks the bring-up image fails here
      # rather than on master. Only master pushes publish it (publish-bringup).
      - name: Bring-up ISO and checksum
        run: |
          cmake --build build --target iso-bringup
          cd build
          sha256sum arc_os-bringup.iso > arc_os-bringup.iso.sha256
          cat arc_os-bringup.iso.sha256

      - name: Host tests
        run: |
          cmake -B build-tests -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests -L host --output-on-failure

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: arc_os-iso
          path: build/arc_os.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload bring-up ISO
        uses: actions/upload-artifact@v4
        with:
          name: arc_os-bringup
          path: |
            build/arc_os-bringup.iso
            build/arc_os-bringup.iso.sha256
          if-no-files-found: error
          retention-days: 3

      # kernel.elf and the user programs, for the qemu job (top-level files only)
      - name: Pack cross build outputs
        run: find build -maxdepth 1 -type f ! -name '.*' ! -name '*.iso' ! -name '*.ninja' ! -name '*.txt' ! -name '*.cmake' -print0 | tar --null -cf cross-build.tar -T -

      - name: Upload cross build outputs
        uses: actions/upload-artifact@v4
        with:
          name: cross-build
          path: cross-build.tar
          if-no-files-found: error
          retention-days: 3

  qemu:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Dev setup (apt, Limine)
        run: |
          bash tools/dev-setup.sh apt
          bash tools/dev-setup.sh limine

      # Hosted runners have /dev/kvm but only root can open it by default.
      - name: Enable KVM if present
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: QEMU tests run under TCG"
          fi

      - name: Download cross build outputs
        uses: actions/download-artifact@v4
        with:
          name: cross-build

      - name: QEMU tests
        run: |
          tar -xf cross-build.tar
          cmake -B build-tests -G Ninja
          ctest --test-dir build-tests -L qemu --output-on-failure

      - name: Upload serial logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: build/qemu-test/*.serial.log
          retention-days: 7

  # Replaces the `bringup-latest` pre-release with this commit's bring-up image and
  # its SHA-256, so a laptop smoke boot needs only a browser download (no login,
  # no unzip). The repo is public, so the image is public. Only this job gets a
  # write token. It runs only for pushes to master (never for PRs, so never for
  # fork code), only after the build, host and QEMU tests passed, and it checks
  # out and runs no repo code: it downloads the artifact and calls the gh CLI
  # that is already on the runner. The one action it uses is pinned by commit.
  publish-bringup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-and-test, qemu]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: bringup-latest
    steps:
      - name: Download bring-up ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: arc_os-bringup

      - name: Verify checksum
        run: sha256sum -c arc_os-bringup.iso.sha256

      - name: Write release notes
        run: |
          short="${GITHUB_SHA:0:7}"
          hash="$(cut -d' ' -f1 arc_os-bringup.iso.sha256)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > notes.md <<EOF
          Bring-up image for real-hardware boots, built by CI from master commit [\`$short\`]($url/commit/$GITHUB_SHA) on $(date -u '+%Y-%m-%d %H:%M UTC') ([run]($url/actions/runs/$GITHUB_RUN_ID)).

          SHA-256 of \`arc_os-bringup.iso\`: \`$hash\`

          This pre-release is replaced after every push to master that passes CI. How to write the stick and boot it: [docs/hardware/bringup.md]($url/blob/$GITHUB_SHA/docs/hardware/bringup.md).
          EOF
          cat notes.md

      # Delete and recreate, rather than edit, so the tag always points at the
      # commit the image was built from. gh creates the release as a draft,
      # uploads both files, then publishes it, so the new release never shows
      # without its image.
      - name: Publish bringup-latest
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          # A tag left without its release (a run stopped half-way) would pin the
          # new release to the old commit, so remove it too.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Bring-up image (latest master, ${GITHUB_SHA:0:7})" \
            --notes-file notes.md \
            arc_os-bringup.iso arc_os-bringup.iso.sha256
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
